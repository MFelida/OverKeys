name: Release Approval & Auto-Publish

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  releases: write

jobs:
  # Monitor release-please PR for approval
  monitor-release-pr:
    if: |
      github.event.pull_request.user.login == 'release-please[bot]' &&
      startsWith(github.event.pull_request.title, 'chore: release')
    runs-on: ubuntu-latest
    outputs:
      is_release_pr: ${{ steps.check.outputs.is_release_pr }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Check if this is a release PR
        id: check
        run: |
          if [[ "${{ github.event.pull_request.title }}" == "chore: release"* ]]; then
            echo "is_release_pr=true" >> $GITHUB_OUTPUT
            echo "✅ This is a release-please PR"
          else
            echo "is_release_pr=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Extract version from PR title
        id: extract
        if: steps.check.outputs.is_release_pr == 'true'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ $TITLE =~ v([0-9.]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "📌 Release version: $VERSION"
          fi
        shell: bash

      - name: Add approval instructions to PR
        if: steps.check.outputs.is_release_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.extract.outputs.version }}';
            const prNumber = context.issue.number;

            const instruction = `## 🚀 Release Approval Workflow

            ### Step 1: Verify Release Content ✅
            - Review the changelog and version bump
            - Ensure all changes are intended
            - Check that automated installer tests passed (see build artifacts)

            ### Step 2: Approve for Publishing
            When you're ready to publish this release:

            1. **Add the \`approved-for-release\` label** to this PR (or react with ✅)
            2. A workflow will:
               - Merge this PR automatically
               - Create a GitHub Release (draft → published)
               - Publish to Windows Package Manager (winget)

            ### Step 3: Monitor Publishing
            Once merged, check [Actions](https://github.com/${{ github.repository }}/actions) for:
            - **build-release**: Uploads installers to release
            - **winget-releaser**: Publishes to Windows Package Manager (~5 min delay)

            ---
            **Release:** v${version} | **PR:** #${prNumber}`;

            // Check if comment already exists to avoid duplicates
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const hasInstruction = comments.data.some(c => 
              c.body.includes('🚀 Release Approval Workflow')
            );

            if (!hasInstruction) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: instruction
              });
            }

  # Auto-merge and publish when approved
  auto-publish-release:
    needs: monitor-release-pr
    if: |
      github.event.pull_request.user.login == 'release-please[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'approved-for-release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Approve and Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;

            try {
              // Get PR details
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              // Check if PR is ready to merge
              if (!pr.data.mergeable) {
                core.warning('⚠️ PR has merge conflicts, cannot auto-merge');
                return;
              }

              // Merge the PR
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: pr.data.title,
                commit_message: `Approved for release\n\nRelease-Please PR automatically merged.`
              });

              console.log('✅ PR merged successfully');
            } catch (error) {
              core.error(`Failed to merge PR: ${error.message}`);
              throw error;
            }

      - name: Wait for Release Event
        id: wait_release
        run: |
          # Wait for release-please to create the release (usually within 30 seconds)
          echo "⏳ Waiting for release-please to create GitHub Release..."
          sleep 15
        shell: bash

      - name: Check for created release
        id: check_release
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch the latest release
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            if (releases.data.length === 0) {
              core.warning('⚠️ No release found yet, it may be creating');
              echo "RELEASE_ID=0" >> process.env.GITHUB_OUTPUT;
              return;
            }

            const release = releases.data[0];
            const releaseId = release.id;
            const isDraft = release.draft;

            console.log(`📦 Found release: ${release.tag_name} (Draft: ${isDraft})`);
            echo `RELEASE_ID=${releaseId}` >> process.env.GITHUB_OUTPUT;
            echo `IS_DRAFT=${isDraft}` >> process.env.GITHUB_OUTPUT;

      - name: Publish Release (if still draft)
        if: steps.check_release.outputs.IS_DRAFT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = parseInt('${{ steps.check_release.outputs.RELEASE_ID }}');

            if (releaseId === 0) {
              core.warning('⚠️ Could not determine release ID, skipping publish');
              return;
            }

            try {
              const release = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              });

              if (release.data.draft) {
                // Publish the draft release
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  draft: false
                });

                console.log(`✅ Published release: ${release.data.tag_name}`);
              } else {
                console.log(`ℹ️ Release ${release.data.tag_name} is already published`);
              }
            } catch (error) {
              core.warning(`⚠️ Could not publish release: ${error.message}`);
            }

      - name: Report status
        run: |
          echo "✅ Release approval workflow completed"
          echo "📦 The release is now public and winget-releaser will publish to Windows Package Manager"
        shell: bash
